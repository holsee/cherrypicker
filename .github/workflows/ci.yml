name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  precommit:
    name: mix precommit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.x"
          elixir-version: "1.20.x"
      - run: mix deps.get
      - run: mix precommit
